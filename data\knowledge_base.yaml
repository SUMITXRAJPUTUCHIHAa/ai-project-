admission:
  booking_fee: 10000
  steps:
  - Register on lpu.in with your mobile number and email.
  - Book and appear for LPUNEST (or submit your JEE Main / CUET / CAT-type score where accepted).
  - Pay the INR 10,000 booking amount; it is adjusted against your first-semester fee.
  - Check your scholarship slab from the LPUNEST result.
  - Attend the interview if your chosen specialisation requires one (e.g. AI and Data Engineering tracks).
  - Pay the first-semester fee, book hostel (use the Early Decision Benefit if eligible) and upload documents.
  - Complete document verification and receive your UMS registration login.
  deadlines: 'Dates change every session. Reference points for 2026: B.Tech Phase III deadline extended to 30 June
    2026; BCA August-session applications closed 20 August 2026; classes start July-August. 2027 dates are announced
    on lpu.in/nest.'
documents:
  ug:
  - Class 10 marksheet and certificate (date-of-birth proof)
  - Class 12 marksheet / provisional result
  - LPUNEST / JEE Main / CUET scorecard
  - Government photo ID (Aadhaar / passport)
  - Passport-size photographs
  - Transfer/migration certificate (where applicable)
  - Category or other certificates if claiming a benefit
  pg:
  - Graduation marksheets and degree / provisional certificate
  - Class 10 and 12 marksheets
  - CAT / XAT / MAT / CMAT / LPUNEST scorecard
  - Government photo ID
  - Passport-size photographs
  - Work-experience letters if applicable
  lateral:
  - Diploma (or 1st-year) marksheets and certificates
  - Class 10 marksheet
  - Government photo ID and photographs
  - Migration/transfer certificate
  international:
  - Passport and visa copy
  - Academic transcripts with equivalence certificate
  - Photographs
  - English proficiency proof where applicable
  - Medical/fitness documents as required
  note: Originals are verified at the university. Keep self-attested photocopies ready.
ums:
  portal: https://ums.lpu.in
  login: Sign in with your registration number and the password issued at admission.
  forgot: Use 'Forgot password' on the UMS login page and verify through your registered mobile or email. If that
    fails, contact the university helpdesk.
  features:
  - Attendance and timetable
  - Results and grade cards
  - Fee payment and receipts
  - Notices, messages and requests
  - Registration for courses and exams
special:
  lateral:
    fees:
      Diploma CSE (lateral): 30000
      B.Tech CSE (lateral entry): 160000
      B.Tech CSE - AI & ML (lateral entry): 200000
    eligibility: Diploma holders enter B.Tech directly into the 2nd year (3-year programme) with the required diploma
      marks; 12th-pass students who completed a first-year can also apply through lateral routes. Confirm exact
      marks on the programme page.
    note: Fees are per semester (programme fee).
  international:
    fees:
      B.Tech CSE / IT: USD 2,450 per semester
      B.Tech (Hons.) CSE specialisations: USD 3,000 per semester
      Examination fee: USD 75 per semester
    hostel: International students use the same room tiers (1-4 seater, AC/non-AC, standard or apartment). Hostel
      and mess for international applicants are quoted in USD on LPU's international admissions page; confirm the
      current tariff with the International Office.
    note: Fee in INR applies to India, Sri Lanka, Bhutan, Nepal and Bangladesh; other countries pay in USD.
  loan:
    text: For an education loan, banks usually ask for an admission/fee structure letter and a Bonafide certificate.
      Request them from the university once your admission is confirmed (via UMS request or the Student Welfare
      / Accounts office). Bonafide letters are usually issued within a few working days; confirm the current turnaround
      with the helpdesk.
    verified: false
  refund:
    text: LPU follows UGC fee-refund norms. In general a withdrawal well before the session starts gets most of
      the fee back less a small processing charge, and the refund percentage shrinks as the start date passes. The
      INR 10,000 booking amount is adjusted against semester 1, not charged on top. Exact slabs and timelines are
      in LPU's refund policy; confirm with Accounts before withdrawing.
    verified: false
exam_fee_note: Examination fee INR 5,000 per semester for most UG programmes (from semester 2 for B.Tech); INR 4,500
  for many PG programmes.

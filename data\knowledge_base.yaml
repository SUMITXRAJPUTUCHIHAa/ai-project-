meta:
  university: Lovely Professional University (LPU), Phagwara, Punjab
  kb_version: '2.4'
  data_session: Admission 2026-27 (reference)
  disclaimer: Figures compiled from lpu.in and public education portals for the 2026-27 session. They can change;
    always confirm on lpu.in before paying any fee.
  contact:
    phone: 01824-404404
    website: https://www.lpu.in
    ums: https://ums.lpu.in
  sources:
    fees: https://www.lpu.in/nest/btech/fee-and-scholarship.php
    hostel: https://collegedunia.com/university/25787-lovely-professional-university-lpu-jalandhar/hostel
    programmes: https://www.lpu.in/programmes/all/
programmes:
  btech_cse:
    name: B.Tech CSE (standard / IT)
    level: UG
    duration_years: 4
    semesters: 8
    fee_per_sem: 160000
    exam_fee: 5000
    exam_from_sem: 2
    scholarship_family: btech
    eligibility:
      qualification: 10+2 with Physics, Mathematics and English
      min_percent: 60
      entrance: LPUNEST or JEE Main
      note: Minimum aggregate shown is the commonly published criterion; some specialisations also require an interview.
    curriculum: Core CS (programming, data structures, algorithms, DBMS, OS, networks), mathematics, labs, industry-aligned
      electives and a final-year project/internship.
    highlights: Most CSE specialisations (Cloud, Data Science, Cyber Security, Fintech and AI) are priced between
      INR 1.6L and INR 2L per semester.
  btech_aiml:
    name: B.Tech CSE - AI & ML
    level: UG
    duration_years: 4
    semesters: 8
    fee_per_sem: 200000
    exam_fee: 5000
    exam_from_sem: 2
    scholarship_family: btech
    eligibility:
      qualification: 10+2 with Physics, Mathematics and English
      min_percent: 60
      entrance: LPUNEST or JEE Main (+ interview for some AI tracks)
      note: Some portals list INR 1.6L for AI/ML; the INR 2L figure is from the programme listing. Confirm for your
        exact specialisation.
    curriculum: Machine learning, deep learning, NLP, computer vision, data engineering, probability and statistics,
      plus capstone projects.
    highlights: Industry-tie-up variants (Applied AI, AI & Data Engineering, Gen AI) carry their own fee slabs.
  btech:
    name: B.Tech (other branches)
    level: UG
    duration_years: 4
    semesters: 8
    fee_per_sem: 140000
    exam_fee: 5000
    exam_from_sem: 2
    scholarship_family: btech
    eligibility:
      qualification: 10+2 with Physics, Mathematics and English (PCM)
      min_percent: 60
      entrance: LPUNEST or JEE Main
      note: Applies to Civil, Mechanical, EEE, Automobile and similar core branches; ECE and Robotics are priced
        higher.
    curriculum: Engineering mathematics and sciences in year 1, then branch-core subjects, labs, electives and a
      project.
    highlights: Core branches INR 1.4L per semester; Robotics & Automation INR 1.8L; optional 2+2 international
      credit transfer carries an extra INR 50,000 in semester 1.
  mba:
    name: MBA (full-time)
    level: PG
    duration_years: 2
    semesters: 4
    fee_per_sem: 200000
    exam_fee: 4500
    exam_from_sem: 1
    scholarship_family: mba
    eligibility:
      qualification: Bachelor's degree in any discipline
      min_percent: 50
      entrance: LPUNEST or CAT / XAT / MAT / CMAT
      note: Semester fee ranges roughly INR 1.4L-2.5L by specialisation. The 50% minimum is the commonly published
        figure.
    curriculum: Management core (finance, marketing, HR, operations, analytics), specialisation electives, summer
      internship and a capstone.
    highlights: Total tuition is roughly INR 8.8L-10L for the 2 years; online MBA is a separate, cheaper programme.
  bca:
    name: BCA
    level: UG
    duration_years: 3
    semesters: 6
    fee_per_sem: 80000
    exam_fee: 5000
    exam_from_sem: 1
    scholarship_family: ug
    eligibility:
      qualification: 10+2 in any stream with English
      min_percent: 50
      entrance: LPUNEST or CUET
      note: Portals quote between 50% and 60% aggregate; confirm for your category.
    curriculum: Programming, data structures, DBMS, web development, networks, software engineering, with specialisations
      such as Data Science and Cyber Security.
    highlights: Tuition about INR 4.8L over 3 years before scholarships.
  barch:
    name: B.Arch
    level: UG
    duration_years: 5
    semesters: 10
    fee_per_sem: 120000
    exam_fee: 5000
    exam_from_sem: 1
    scholarship_family: ug
    eligibility:
      qualification: 10+2 with Physics, Mathematics and Chemistry/Technical subject
      min_percent: 50
      entrance: NATA or JEE Main Paper 2 (CoA norms)
      note: A one-time uniform fee of INR 4,000 applies. CoA-approved 5-year programme.
    curriculum: Design studio, building construction, structures, history of architecture, environmental design,
      professional practice and training.
    highlights: Fee about INR 1.2L per semester plus INR 5,000 exam fee.
aliases_note: Alias mapping lives in engine/preprocessor.py
scholarship:
  lpunest_phases:
  - phase: Phase I
    note: Earliest LPUNEST window; early registration generally gives the widest choice of slots and the Early Decision
      Benefit on hostel fees.
  - phase: Phase II
    note: Mid-cycle exam window; same cut-off based scholarship slabs apply to the score obtained.
  - phase: Phase III
    note: Last window before the session starts. For 2026 the B.Tech deadline was extended to 30 June 2026.
  slabs:
    btech:
    - cutoff: A
      pct: 60
    - cutoff: B
      pct: 50
    - cutoff: C
      pct: 40
    - cutoff: D
      pct: 30
    ug:
    - cutoff: A
      pct: 35
    - cutoff: B
      pct: 30
    - cutoff: C
      pct: 25
    - cutoff: D
      pct: 20
    mba:
    - cutoff: A
      pct: 35
    - cutoff: B
      pct: 30
    - cutoff: C
      pct: 25
    - cutoff: D
      pct: 20
  other:
  - 'LPU RISE: 100% programme-fee waiver for national-level toppers and top board performers.'
  - Marks-based scholarships on previous two qualifying exams.
  - Sports, cultural and need-based aid; 20% for female candidates and alumni on Ph.D.
  - Scholarships apply to programme (tuition) fee only, not examination fee, hostel or mess.
  note: Cut-off A-D score thresholds differ by programme and phase. Check lpu.in/nest for the exact score needed.
